# Smithery configuration file for Shelf MCP Server
# Documentation: https://smithery.ai/docs/build/project-config/smithery-yaml

startCommand:
  # Hosted deployments on Smithery require HTTP transport
  type: http

  httpServer:
    port: 8000
    healthCheckPath: /healthz
  
  # JSON Schema defining the configuration options
  configSchema:
    type: object
    required:
      - shelfApiKey
    properties:
      shelfApiKey:
        type: string
        title: "Shelf API Key"
        description: "Your Shelf.im / DataMover API key. Contact team@koodos.com to request access."
        pattern: "^[A-Za-z0-9_-]+$"
      
      apiBaseUrl:
        type: string
        title: "API Base URL"
        description: "Base URL for the Shelf API (optional, defaults to https://api.shelf.im/v1)"
        default: "https://api.shelf.im/v1"
        pattern: "^https?://.+"
  
  # Function that produces the CLI command to start the MCP server
  commandFunction: |
    (config) => {
      const port = 8000;
      return {
        command: 'python',
        args: [
          'shelf_mcp_server.py',
          '--transport',
          'streamable-http',
          '--host',
          '0.0.0.0',
          '--port',
          String(port)
        ],
        env: {
          SHELF_API_KEY: config.shelfApiKey,
          SHELF_API_BASE_URL: config.apiBaseUrl || 'https://api.shelf.im/v1',
          MCP_TRANSPORT: 'streamable-http',
          MCP_HOST: '0.0.0.0',
          MCP_PORT: String(port),
          PYTHONUNBUFFERED: '1'
        }
      };
    }

# Build configuration (optional for Python)
build:
  # Path for Docker build context if needed
  dockerBuildPath: .
